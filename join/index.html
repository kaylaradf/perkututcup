<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0c10" />
  <title>Daftar · Perkutut Cup 2026</title>
  <link rel="icon" type="image/svg+xml" href="../assets/svg/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Pixelify+Sans:wght@400;600;700&family=Poppins:wght@400;500;700&family=Space+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../auth-motion.css" />
</head>
<body class="auth-body">
  <main class="auth-screen auth-screen--join">
    <div class="auth-decor" aria-hidden="true">
      <img class="auth-halo" src="../assets/svg/mascot-halo.svg" alt="" width="380" height="380" />
      <img class="auth-star auth-star-1" src="../assets/svg/sparkle.svg" alt="" width="24" height="24" />
      <img class="auth-star auth-star-2" src="../assets/svg/sparkle.svg" alt="" width="24" height="24" />
      <img class="auth-star auth-star-3" src="../assets/svg/sparkles.svg" alt="" width="28" height="28" />
      <img class="auth-star auth-star-4" src="../assets/svg/sparkles-2.svg" alt="" width="28" height="28" />
      <span class="auth-pixel auth-pixel-1"></span>
      <span class="auth-pixel auth-pixel-2"></span>
      <span class="auth-pixel auth-pixel-3"></span>
      <span class="auth-pixel auth-pixel-4"></span>
    </div>

    <section class="auth-card auth-card--join" aria-labelledby="auth-title">
      <a class="auth-home" href="../#home">
        <img src="../assets/svg/icon-home.svg" width="17" height="16" alt="" />
        <span>Home</span>
      </a>

      <img class="auth-logo" src="../assets/images/logo-navbar-final.png" alt="Perkutut Cup 2026" width="212" height="118" />
      <h1 class="auth-title" id="auth-title">Daftar</h1>
      <p class="auth-subtitle">Buat akun untuk bergabung dengan Perkutut Cup 2026.</p>

      <form class="auth-form" data-auth-form="join" novalidate>
        <label class="auth-field">
          <span>Full Name</span>
          <span class="auth-control">
            <input name="fullName" type="text" autocomplete="name" placeholder="Masukkan nama lengkap" data-allowlist="name" maxlength="100" required />
          </span>
        </label>

        <label class="auth-field">
          <span>Email</span>
          <span class="auth-control">
            <img class="auth-field-icon" src="../assets/svg/icon-mail.svg" width="14" height="14" alt="" />
            <input name="email" type="email" autocomplete="email" placeholder="Masukkan alamat email" data-allowlist="email" maxlength="254" required />
          </span>
        </label>

        <label class="auth-field auth-field--password">
          <span>Password</span>
          <span class="auth-control">
            <img class="auth-field-icon" src="../assets/svg/icon-lock.svg" width="14" height="14" alt="" />
            <input name="password" type="password" autocomplete="new-password" placeholder="Buat kata sandi" data-allowlist="password" aria-describedby="password-rules" minlength="8" maxlength="128" required />
            <button class="auth-password-toggle" type="button" data-password-toggle aria-label="Tampilkan kata sandi" aria-pressed="false">
              <img src="../assets/svg/icon-eye.svg" width="14" height="14" alt="" />
            </button>
          </span>
          <ul class="password-rules" id="password-rules" aria-label="Persyaratan kata sandi" hidden>
            <li data-password-rule="length"><span aria-hidden="true">○</span> Minimal 8 karakter</li>
            <li data-password-rule="lowercase"><span aria-hidden="true">○</span> Huruf kecil</li>
            <li data-password-rule="uppercase"><span aria-hidden="true">○</span> Huruf besar</li>
            <li data-password-rule="number"><span aria-hidden="true">○</span> Angka</li>
            <li data-password-rule="symbol"><span aria-hidden="true">○</span> Simbol</li>
          </ul>
        </label>

        <label class="auth-field">
          <span>Confirm Password</span>
          <span class="auth-control">
            <img class="auth-field-icon" src="../assets/svg/icon-lock.svg" width="14" height="14" alt="" />
            <input name="confirmPassword" type="password" autocomplete="new-password" placeholder="Ulangi kata sandi" data-allowlist="password" minlength="8" maxlength="128" required />
            <button class="auth-password-toggle" type="button" data-password-toggle aria-label="Tampilkan kata sandi" aria-pressed="false">
              <img src="../assets/svg/icon-eye.svg" width="14" height="14" alt="" />
            </button>
          </span>
        </label>

        <button class="auth-submit" type="submit">Buat Akun</button>
        <p class="auth-message" data-auth-message role="status" aria-live="polite"></p>
      </form>

      <p class="auth-switch">Sudah punya akun? <a href="../sign-in/">Masuk</a></p>
    </section>
  </main>
  <script src="../script.js" defer></script>
</body>
</html>
