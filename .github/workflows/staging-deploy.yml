name: Deploy staging

on:
  workflow_dispatch:
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Validate staging configuration
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_USER: ${{ vars.STAGING_USER }}
          STAGING_DEPLOY_DIR: ${{ vars.STAGING_DEPLOY_DIR }}
          STAGING_SERVICE: ${{ vars.STAGING_SERVICE }}
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
        run: |
          set -euo pipefail
          for name in TS_AUTHKEY STAGING_SSH_PRIVATE_KEY STAGING_HOST STAGING_USER STAGING_DEPLOY_DIR STAGING_SERVICE STAGING_HEALTH_URL; do
            if [[ -z "${!name}" ]]; then echo "Missing required Actions secret/variable: $name" >&2; exit 1; fi
          done

      - uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Configure SSH and sync source
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_USER: ${{ vars.STAGING_USER }}
          STAGING_DEPLOY_DIR: ${{ vars.STAGING_DEPLOY_DIR }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts
          # rsync tracked source in-place. --exclude protects server-only state
          # (.env, .venv, uploads); no --delete so removed files linger harmlessly.
          git archive --format=tar --output=staging.tar HEAD
          mkdir payload && tar -xf staging.tar -C payload
          rsync -a --exclude=.env --exclude=.venv --exclude=uploads \
            -e "ssh -i ~/.ssh/staging_key" \
            payload/ "$STAGING_USER@$STAGING_HOST:$STAGING_DEPLOY_DIR/"

      - name: Install deps, restart, health-check
        env:
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_USER: ${{ vars.STAGING_USER }}
          STAGING_DEPLOY_DIR: ${{ vars.STAGING_DEPLOY_DIR }}
          STAGING_SERVICE: ${{ vars.STAGING_SERVICE }}
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/staging_key "$STAGING_USER@$STAGING_HOST" bash -s -- \
            "$STAGING_DEPLOY_DIR" "$STAGING_SERVICE" "$STAGING_HEALTH_URL" <<'REMOTE'
          set -euo pipefail
          deploy_dir=$1 service=$2 health_url=$3
          "$deploy_dir/.venv/bin/pip" install -q -r "$deploy_dir/backend/requirements.txt"
          systemctl restart "$service"
          for i in $(seq 1 12); do
            if curl --fail --silent --max-time 5 "$health_url" >/dev/null; then
              echo "Deploy healthy."
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after restart" >&2
          systemctl status "$service" --no-pager -n 20 >&2
          exit 1
          REMOTE
