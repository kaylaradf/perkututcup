<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0c10" />
  <title>Daftar · Perkutut Cup 2026</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Pixelify+Sans:wght@400;600;700&family=Poppins:wght@400;500;700&family=Space+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-body">
  <main class="auth-screen auth-screen--join">
    <section class="auth-card auth-card--join" aria-labelledby="auth-title">
      <a class="auth-home" href="index.html#home">
        <img src="assets/icon-home.svg" width="17" height="16" alt="" />
        <span>Home</span>
      </a>

      <img class="auth-logo" src="assets/logo-navbar-final.png" alt="Perkutut Cup 2026" width="212" height="118" />
      <h1 class="auth-title" id="auth-title">Daftar</h1>
      <p class="auth-subtitle">Buat akun untuk bergabung dengan Perkutut Cup 2026.</p>

      <form class="auth-form" data-auth-form="join" novalidate>
        <label class="auth-field">
          <span>Full Name</span>
          <span class="auth-control">
            <input name="fullName" type="text" autocomplete="name" placeholder="Masukkan nama lengkap" required />
          </span>
        </label>

        <label class="auth-field">
          <span>Email</span>
          <span class="auth-control">
            <img class="auth-field-icon" src="assets/icon-mail.svg" width="14" height="14" alt="" />
            <input name="email" type="email" autocomplete="email" placeholder="Masukkan alamat email" required />
          </span>
        </label>

        <label class="auth-field">
          <span>Password</span>
          <span class="auth-control">
            <img class="auth-field-icon" src="assets/icon-lock.svg" width="14" height="14" alt="" />
            <input name="password" type="password" autocomplete="new-password" placeholder="Buat kata sandi" minlength="8" required />
            <button class="auth-password-toggle" type="button" data-password-toggle aria-label="Tampilkan kata sandi" aria-pressed="false">
              <img src="assets/icon-eye.svg" width="14" height="14" alt="" />
            </button>
          </span>
        </label>

        <label class="auth-field">
          <span>Confirm Password</span>
          <span class="auth-control">
            <img class="auth-field-icon" src="assets/icon-lock.svg" width="14" height="14" alt="" />
            <input name="confirmPassword" type="password" autocomplete="new-password" placeholder="Ulangi kata sandi" minlength="8" required />
            <button class="auth-password-toggle" type="button" data-password-toggle aria-label="Tampilkan kata sandi" aria-pressed="false">
              <img src="assets/icon-eye.svg" width="14" height="14" alt="" />
            </button>
          </span>
        </label>

        <button class="auth-submit" type="submit">Buat Akun</button>
        <p class="auth-message" data-auth-message role="status" aria-live="polite"></p>
      </form>

      <p class="auth-switch">Sudah punya akun? <a href="sign-in.html">Masuk</a></p>
    </section>
  </main>
  <script src="script.js" defer></script>
</body>
</html>
